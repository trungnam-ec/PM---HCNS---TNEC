<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#005BAC" />
    <title>Mất kết nối</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: linear-gradient(160deg, #ffffff 0%, #e6effd 100%);
        color: #1e293b;
        text-align: center;
      }
      .card {
        max-width: 340px;
        width: 100%;
        background: #fff;
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 28px;
        padding: 40px 28px;
        box-shadow: 0 20px 50px -20px rgba(0, 91, 172, 0.25);
      }
      .logo { width: 64px; height: 64px; margin: 0 auto 20px; display: block; }
      h1 { font-size: 18px; font-weight: 800; margin: 0 0 8px; letter-spacing: -0.02em; }
      p { font-size: 13px; line-height: 1.6; color: #64748b; margin: 0 0 24px; }
      button {
        width: 100%;
        border: 0;
        background: #005bac;
        color: #fff;
        font-size: 14px;
        font-weight: 700;
        padding: 14px;
        border-radius: 16px;
        cursor: pointer;
      }
      button:active { transform: scale(0.98); }
      @media (prefers-color-scheme: dark) {
        body { background: #0f172a; color: #e2e8f0; }
        .card { background: #1e293b; border-color: rgba(148, 163, 184, 0.15); }
        p { color: #94a3b8; }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="logo" src="/apple-icon.png" alt="Logo" />
      <h1>Đang mất kết nối mạng</h1>
      <p>Ứng dụng cần Internet để tải dữ liệu. Vui lòng kiểm tra Wi-Fi hoặc 4G rồi thử lại.</p>
      <button onclick="location.reload()">Thử lại</button>
    </div>
  </body>
</html>
